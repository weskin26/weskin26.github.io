<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>We Skin · Catálogo</title>
<meta name="description" content="Skincare y maquillaje de marcas internacionales. Pide por WhatsApp.">
<link rel="icon" href="icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<script>
/* =========================================================
   CONFIGURACIÓN — lo único que necesitas cambiar
   ========================================================= */
const CONFIG = {
  // Tu WhatsApp con 57 adelante, sin espacios ni +. Ej: "573001234567"
  whatsapp: "57XXXXXXXXXX",
  instagram: "https://instagram.com/we_skin__",
  // Link de tu Google Sheet publicado como CSV (Archivo > Compartir > Publicar en la web > CSV).
  // Si lo dejas vacío, la página muestra los productos de ejemplo.
  hojaCSV: ""
};
</script>
<style>
  :root{
    --bg:#ffffff; --card:#ffffff; --sand:#ffffff; --sand-2:#f4f4f3;
    --ink:#3e4341; --taupe:#3e4341; --muted:#7f8583; --beige:#f8e8dc; --beige-2:#edcfb8; --accent:#9a5f37; --line:#eeeeed;
    --ok:#5a5754; --soft:#f6f6f5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  img{display:block;max-width:100%}
  button{font-family:inherit;cursor:pointer}

  header{background:var(--sand);padding:14px 16px 14px;position:sticky;top:0;z-index:5;border-bottom:1px solid #ece8e4}
  .top{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
  .logo{height:46px;width:auto}
  .ig{margin-left:auto;font-size:13px;color:var(--taupe);text-decoration:none;font-weight:500}
  .cart-btn{position:relative;width:44px;height:44px;border-radius:999px;border:1px solid #e6e6e4;background:#fff;display:grid;place-items:center}
  .cart-btn svg{width:20px;height:20px;stroke:var(--ink)}
  .badge{position:absolute;top:-4px;right:-4px;background:var(--beige-2);color:var(--taupe);font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:999px;display:grid;place-items:center;padding:0 5px}
  .badge[hidden]{display:none}
  .search{max-width:1100px;margin:12px auto 0;position:relative}
  .search input{width:100%;padding:12px 16px 12px 42px;border-radius:999px;border:1px solid #e6e6e4;background:#fafafa;font:inherit;font-size:15px;color:var(--ink);outline:none}
  .search input:focus{border-color:var(--taupe)}
  .search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted)}
  .chips{max-width:1100px;margin:12px auto 0;display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:8px 16px;border-radius:999px;border:1px solid #e6e6e4;background:#fff;color:var(--ink);font-size:14px;font-weight:500}
  .chip.on{background:var(--beige);border-color:var(--beige-2);color:var(--taupe);font-weight:700}

  main{max-width:1100px;margin:0 auto;padding:20px 16px 120px}
  h2{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:30px;margin:8px 0 4px;color:var(--taupe)}
  .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  @media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
  @media(min-width:980px){.grid{grid-template-columns:repeat(4,1fr)}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
  .ph{aspect-ratio:1/1;background:#fff;position:relative;display:grid;place-items:center;padding:14px}
  .ph img{width:100%;height:100%;object-fit:contain}
  .ph .ini{font-family:"Cormorant Garamond",serif;font-size:44px;color:var(--taupe);background:var(--soft);width:100%;height:100%;border-radius:12px;display:grid;place-items:center}
  .tag{position:absolute;top:10px;left:10px;background:var(--beige);color:var(--taupe);font-size:10px;letter-spacing:.08em;font-weight:700;padding:5px 10px;border-radius:999px;text-transform:uppercase}
  .tag.out{background:#fff;color:var(--muted);border:1px solid var(--line)}
  .info{padding:12px 14px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;flex:1}
  .brand{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .name{font-size:14px;line-height:1.3;font-weight:500;color:var(--ink)}
  .desc{font-size:12px;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .price{font-size:17px;font-weight:700;color:var(--ink);margin-top:auto;padding-top:6px}
  .add{margin-top:8px;padding:10px;border-radius:999px;border:1px solid var(--beige-2);background:var(--beige);color:var(--taupe);font-size:13px;font-weight:700}
  .add:disabled{background:transparent;color:var(--muted);border-color:var(--line);cursor:default}
  .card.agotado .ph img{opacity:.45}
  .empty{text-align:center;color:var(--muted);padding:40px 0}

  .float{position:fixed;left:16px;right:16px;bottom:16px;max-width:520px;margin:0 auto;background:var(--beige-2);color:var(--taupe);border:0;border-radius:999px;padding:15px 22px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;box-shadow:0 8px 24px rgba(90,87,84,.15);z-index:6}
  .float[hidden]{display:none}

  .sheet-bg{position:fixed;inset:0;background:rgba(90,87,84,.25);z-index:10;display:none}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;padding:20px 16px 18px;z-index:11;max-height:85vh;display:none;flex-direction:column}
  .open .sheet-bg{display:block}.open .sheet{display:flex}
  .sheet h3{font-family:"Cormorant Garamond",serif;font-size:28px;margin:0 0 10px;color:var(--taupe);display:flex;justify-content:space-between;align-items:center}
  .x{border:0;background:var(--sand-2);width:36px;height:36px;border-radius:999px;font-size:18px;color:var(--ink)}
  .items{overflow-y:auto;flex:1}
  .it{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .it img,.it .mini{width:56px;height:56px;border-radius:10px;object-fit:contain;background:#fff;flex:none;border:1px solid var(--line)}
  .it .mini{display:grid;place-items:center;font-family:"Cormorant Garamond",serif;font-size:22px;color:var(--taupe)}
  .it .t{flex:1;font-size:13px;line-height:1.3}
  .it .t b{display:block;font-size:14px;margin-top:2px}
  .qty{display:flex;align-items:center;gap:6px}
  .qty button{width:30px;height:30px;border-radius:999px;border:1px solid #e6e6e4;background:#fff;font-size:16px;color:var(--ink)}
  .qty span{min-width:18px;text-align:center;font-weight:700}
  .total{display:flex;justify-content:space-between;font-size:17px;font-weight:700;padding:14px 0 10px}
  .send{width:100%;padding:15px;border-radius:999px;border:0;background:#25a35a;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
  .note{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 0}

  footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 100px}
  footer a{color:var(--taupe)}
  /* ===== Categorías verticales + productos en cuadrícula ===== */
  .layout{max-width:1100px;margin:0 auto;display:flex;align-items:flex-start}
  aside{position:sticky;top:132px;flex:none;width:104px;padding:20px 0 20px 12px;max-height:calc(100vh - 132px);overflow-y:auto}
  aside .chips{flex-direction:column;overflow:visible;margin:0;padding:0;gap:6px}
  aside .chip{width:100%;text-align:left;padding:9px 10px;border-radius:12px;font-size:12.5px;line-height:1.25;white-space:normal;border-color:transparent;background:transparent;color:var(--muted)}
  aside .chip.on{background:var(--beige);border-color:var(--beige-2);color:var(--taupe)}
  main{flex:1;min-width:0;padding:20px 12px 120px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  @media(min-width:720px){aside{width:180px;padding-left:16px}aside .chip{font-size:14px}main{padding:20px 16px 120px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
  h2{font-size:26px}
  .ph{padding:10px}
  .tag{top:8px;left:8px;font-size:9px;padding:4px 8px}
  .info{padding:10px 12px 12px}
  .name{font-size:13px}
  .row{display:flex;flex-direction:column;align-items:stretch;gap:8px;margin-top:auto;padding-top:6px}
  .row .price{margin:0;padding:0;font-size:16px}
  .row .add{margin:0}
  /* ===== Acento durazno ===== */
  .tag,.chip.on,.add,.badge{color:var(--accent)}
  .add{border-color:var(--beige-2)}
  aside .chip.on{background:var(--beige);border-color:var(--beige-2);color:var(--accent)}
  .ph .ini{background:#fbf3ed;color:var(--accent)}
  .float{color:var(--accent)}
</style>
</head>
<body>
<header>
  <div class="top">
    <img class="logo" src="logo.png" alt="We Skin">
    <a class="ig" id="ig" href="#" target="_blank" rel="noopener">@we_skin__</a>
    <button class="cart-btn" id="openCart" aria-label="Ver pedido">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      <span class="badge" id="badge" hidden>0</span>
    </button>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar producto o marca…" autocomplete="off">
  </div>
</header>

<div class="layout">
<aside><div class="chips" id="chips"></div></aside>
<main>
  <section id="destSec" hidden>
    <h2>Más vendidos</h2>
    <p class="sub">Los favoritos de nuestras clientas</p>
    <div class="grid" id="dest" style="margin-bottom:28px"></div>
  </section>
  <h2 id="tit">Todos los productos</h2>
  <p class="sub" id="count"></p>
  <div class="grid" id="grid"></div>
</main>
</div>

<footer>We Skin · Skincare y maquillaje de marcas internacionales<br>Pedidos por <a id="waFoot" href="#" target="_blank" rel="noopener">WhatsApp</a></footer>

<button class="float" id="float" hidden><span id="floatTxt">Ver pedido</span><span id="floatTot"></span></button>

<div id="cartWrap">
  <div class="sheet-bg" id="bg"></div>
  <div class="sheet" role="dialog" aria-label="Tu pedido">
    <h3>Tu pedido <button class="x" id="close" aria-label="Cerrar">×</button></h3>
    <div class="items" id="items"></div>
    <div class="total"><span>Total</span><span id="tot"></span></div>
    <button class="send" id="send">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.4-.7-2.9-1.1-4.7-4.1-4.9-4.3-.1-.2-1.2-1.6-1.2-3s.8-2.2 1-2.5c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.5c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.7-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.2z"/></svg>
      Enviar pedido por WhatsApp
    </button>
    <p class="note">Te confirmamos disponibilidad y forma de pago por WhatsApp.</p>
  </div>
</div>

<script>
/* Productos de ejemplo: se usan solo si no hay hoja conectada */
const EJEMPLO = [
  {categoria:"Limpiadores",marca:"Cetaphil",nombre:"Limpiador Facial Piel Grasa 473 ml",referencia:"WS-001",precio:"101475",descripcion:"Limpia a fondo sin resecar. Fórmula dermatológica.",foto:"",agotado:"",destacado:"si"},
  {categoria:"Limpiadores",marca:"La Roche-Posay",nombre:"Effaclar Gel 400 ml",referencia:"WS-002",precio:"167400",descripcion:"Gel purificante para piel grasa y con tendencia acneica.",foto:"",agotado:"",destacado:"si"},
  {categoria:"Limpiadores",marca:"CeraVe",nombre:"Limpiadora Hidratante 473 ml",referencia:"WS-003",precio:"99850",descripcion:"Con ceramidas y ácido hialurónico. Para piel normal a seca.",foto:"",agotado:"",destacado:""},
  {categoria:"Hidratantes",marca:"EOS",nombre:"Crema Hidratante Corporal",referencia:"WS-004",precio:"69000",descripcion:"Hidratación por 24 horas, en 5 fragancias.",foto:"",agotado:"",destacado:"si"},
  {categoria:"Hidratantes",marca:"CeraVe",nombre:"Crema Reparadora Contorno de Ojos 14 ml",referencia:"WS-005",precio:"56610",descripcion:"Reduce la apariencia de ojeras y bolsas.",foto:"",agotado:"",destacado:""},
  {categoria:"Protector solar",marca:"ISDIN",nombre:"Fotoultra 100 Active Unify Color",referencia:"WS-006",precio:"127890",descripcion:"FPS 50+. Protección diaria con color que unifica el tono.",foto:"",agotado:"",destacado:""},
  {categoria:"Maquillaje",marca:"Rare Beauty",nombre:"Soft Pinch Rubor Líquido",referencia:"WS-007",precio:"130150",descripcion:"Fórmula cremosa, acabado luminoso y natural.",foto:"",agotado:"si",destacado:""}
];

const $ = id => document.getElementById(id);
const fmt = n => "$" + Math.round(n).toLocaleString("es-CO");
const norm = s => (s||"").toString().normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const yes = v => ["si","sí","x","1","true","yes"].includes(norm(v));
const esc = s => (s||"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let productos = [], cat = "Todos", cart = {};
try { cart = JSON.parse(localStorage.getItem("weskin-cart")||"{}") || {}; } catch(e){ cart = {}; }
const save = () => { try { localStorage.setItem("weskin-cart", JSON.stringify(cart)); } catch(e){} };

function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c=='"') q=true;
    else if(c==','){ row.push(f); f=""; }
    else if(c=='\n'||c=='\r'){ if(c=='\r'&&text[i+1]=='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c;
  }
  if(f||row.length){ row.push(f); rows.push(row); }
  const head = rows.shift().map(norm);
  return rows.filter(r=>r.some(x=>x.trim())).map(r=>{ const o={}; head.forEach((h,i)=>o[h]=(r[i]||"").trim()); return o; });
}

function limpiar(list){
  return list.map((p,i)=>({
    categoria:p.categoria||"Otros", marca:p.marca||"", nombre:p.nombre||"Producto",
    ref:p.referencia||("P"+i), precio:Number((p.precio||"").toString().replace(/[^\d]/g,""))||0,
    desc:p.descripcion||"", foto:p.foto||"", agotado:yes(p.agotado), destacado:yes(p.destacado)
  })).filter(p=>p.nombre);
}

function foto(p, cls){
  return p.foto ? `<img src="${esc(p.foto)}" alt="${esc(p.nombre)}" loading="lazy" referrerpolicy="no-referrer">`
                : `<div class="${cls}">${esc((p.marca||p.nombre)[0]||"W")}</div>`;
}

function card(p){
  const tag = p.agotado ? `<span class="tag out">Agotado</span>` : (p.destacado ? `<span class="tag">Más vendido</span>` : "");
  return `<article class="card${p.agotado?" agotado":""}">
    <div class="ph">${tag}${foto(p,"ini")}</div>
    <div class="info">
      <span class="brand">${esc(p.marca)}</span>
      <span class="name">${esc(p.nombre)}</span>
      ${p.desc?`<span class="desc">${esc(p.desc)}</span>`:""}
      <div class="row"><span class="price">${p.precio?fmt(p.precio):"Consultar"}</span>
      <button class="add" data-ref="${esc(p.ref)}" ${p.agotado?"disabled":""}>${p.agotado?"Agotado":"Agregar"}</button></div>
    </div></article>`;
}

function render(){
  const q = norm($("q").value);
  const list = productos.filter(p => (cat=="Todos"||p.categoria==cat) &&
    (!q || norm(p.nombre+" "+p.marca+" "+p.categoria+" "+p.ref).includes(q)));
  $("grid").innerHTML = list.map(card).join("") || `<p class="empty" style="grid-column:1/-1">No encontramos productos con esa búsqueda.</p>`;
  $("tit").textContent = cat=="Todos" ? "Todos los productos" : cat;
  $("count").textContent = list.length + (list.length==1?" producto":" productos");
  const dest = productos.filter(p=>p.destacado && !p.agotado);
  $("destSec").hidden = !(dest.length && cat=="Todos" && !q);
  $("dest").innerHTML = dest.slice(0,4).map(card).join("");
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on", c.dataset.c==cat));
  renderCart();
}

function renderChips(){
  const cats = ["Todos", ...new Set(productos.map(p=>p.categoria))];
  $("chips").innerHTML = cats.map(c=>`<button class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join("");
}

function renderCart(){
  const refs = Object.keys(cart).filter(r=>productos.some(p=>p.ref==r));
  let n=0, tot=0;
  $("items").innerHTML = refs.map(r=>{
    const p=productos.find(x=>x.ref==r), k=cart[r]; n+=k; tot+=p.precio*k;
    return `<div class="it">${foto(p,"mini")}<div class="t">${esc(p.marca)}<b>${esc(p.nombre)}</b>${fmt(p.precio*k)}</div>
      <div class="qty"><button data-m="${esc(r)}">−</button><span>${k}</span><button data-p="${esc(r)}">+</button></div></div>`;
  }).join("") || `<p class="empty">Aún no has agregado productos.</p>`;
  $("tot").textContent = fmt(tot);
  $("badge").hidden = !n; $("badge").textContent = n;
  $("float").hidden = !n;
  $("floatTxt").textContent = `Ver pedido (${n})`; $("floatTot").textContent = fmt(tot);
}

function enviar(){
  const refs = Object.keys(cart).filter(r=>productos.some(p=>p.ref==r));
  if(!refs.length) return;
  let tot=0;
  const lineas = refs.map(r=>{ const p=productos.find(x=>x.ref==r), k=cart[r]; tot+=p.precio*k;
    return `• ${k} x ${p.marca} ${p.nombre} (${p.ref}) — ${fmt(p.precio*k)}`; });
  const msg = `Hola We Skin 👋 Quiero hacer este pedido:\n\n${lineas.join("\n")}\n\nTotal: ${fmt(tot)}`;
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank");
}

document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.classList.contains("chip")){ cat=t.dataset.c; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else if(t.classList.contains("add")){ const r=t.dataset.ref; cart[r]=(cart[r]||0)+1; save(); renderCart(); t.textContent="Agregado ✓"; setTimeout(()=>t.textContent="Agregar",900); }
  else if(t.dataset.p){ cart[t.dataset.p]++; save(); renderCart(); }
  else if(t.dataset.m){ const r=t.dataset.m; cart[r]--; if(cart[r]<=0) delete cart[r]; save(); renderCart(); }
});
const abrir = ()=>$("cartWrap").classList.add("open"), cerrar = ()=>$("cartWrap").classList.remove("open");
$("openCart").onclick=abrir; $("float").onclick=abrir; $("close").onclick=cerrar; $("bg").onclick=cerrar; $("send").onclick=enviar;
$("q").addEventListener("input", render);
$("ig").href = CONFIG.instagram; $("waFoot").href = `https://wa.me/${CONFIG.whatsapp}`;

async function iniciar(){
  let data = EJEMPLO;
  if(CONFIG.hojaCSV){
    try { const r = await fetch(CONFIG.hojaCSV + (CONFIG.hojaCSV.includes("?")?"&":"?") + "t=" + Date.now()); data = parseCSV(await r.text()); }
    catch(e){ console.warn("No se pudo leer la hoja", e); }
  }
  productos = limpiar(data);
  renderChips(); render();
}
iniciar();
</script>
</body>
</html>
